<!DOCTYPE html>
<html lang="de" data-theme="auto">

<title>Blitz Duell</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--paper:#ffffff;--soft:#edf2f8;--text:#16243a;--muted:#65758a;--line:#dbe4ee;--accent:#2275e8;--accent-ink:#fff;--winbg:#88ecad;--wintext:#075834;--losebg:#ffc1c5;--losetext:#82202c;--waitbg:#f9bdc5;--warnbg:#ffe2a2;--go-bg:#7ee7a4;--quietbg:#e9eff6;--p0:#e45755;--p1:#287fd1;--p2:#13a079;--p3:#9a65cb}

@media(prefers-color-scheme:dark){:root[data-theme="auto"]{color-scheme:dark;--bg:#111a26;--paper:#202d3d;--soft:#2c3d50;--text:#f5f8fc;--muted:#afbdd0;--line:#40546a;--accent:#8ec1ff;--accent-ink:#13243a;--winbg:#17734d;--wintext:#e7fff0;--losebg:#943d47;--losetext:#fff2f4;--waitbg:#783f49;--warnbg:#866223;--go-bg:#196d4c;--quietbg:#344252;--p0:#ff8b8b;--p1:#90c6ff;--p2:#76e2b9;--p3:#d4acff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:active{filter:brightness(.96)}
#arena{height:100vh;height:100dvh;display:grid;gap:7px;padding:calc(7px + env(safe-area-inset-top)) calc(7px + env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) calc(7px + env(safe-area-inset-left));overflow:hidden}
#arena[data-players="1"]{grid-template: minmax(0,1fr)/minmax(0,1fr)}
#arena[data-players="2"]{grid-template: repeat(2,minmax(0,1fr))/minmax(0,1fr)}
#arena[data-players="3"],#arena[data-players="4"]{grid-template:repeat(2,minmax(0,1fr))/repeat(2,minmax(0,1fr))}
#arena[data-players="2"] .p1{grid-row:1}#arena[data-players="2"] .p0{grid-row:2}
#arena[data-players="3"] .p0{grid-row:2;grid-column:1/span 2}#arena[data-players="3"] .p1{grid-row:1;grid-column:1}#arena[data-players="3"] .p2{grid-row:1;grid-column:2}
#arena[data-players="4"] .p0{grid-row:2;grid-column:1}#arena[data-players="4"] .p1{grid-row:2;grid-column:2}#arena[data-players="4"] .p2{grid-row:1;grid-column:1}#arena[data-players="4"] .p3{grid-row:1;grid-column:2}
.player-card{container-type:size;position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid var(--player);border-radius:clamp(15px,3vw,27px);background:color-mix(in srgb,var(--player) 6%,var(--paper));transition:background .13s,border-color .13s,box-shadow .13s}

#arena[data-scene="live"] .player-card:not(.wrong){background:var(--go-bg)}
.player-card.winner{background:var(--winbg)!important;border-color:#13ac5b;box-shadow:inset 0 0 0 2px #13ac5b;color:var(--wintext)}
.player-card.wrong{background:var(--losebg)!important;border-color:#ec4559;box-shadow:inset 0 0 0 2px #ec4559;color:var(--losetext)}
.player-card.missed{background:var(--quietbg)!important}
.board{container-type:size;position:relative;flex:none;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,2.8cqmin,15px);padding:clamp(8px,4cqmin,26px);padding-top:clamp(33px,12cqmin,62px);text-align:center}

.player-tag .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--player)}.player-tag .label{overflow:hidden;text-overflow:ellipsis}.player-tag b{color:var(--player);font-variant-numeric:tabular-nums}
.game-caption{max-width:99%;font-size:clamp(13px,6cqmin,26px);font-weight:800;line-height:1.18;overflow-wrap:anywhere}

.choices{width:min(100%,780px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(4px,2.2cqmin,12px)}
.choice{min-width:0;min-height:clamp(42px,19cqmin,112px);padding:6px 4px;border:1px solid color-mix(in srgb,var(--text) 15%,var(--line));border-radius:clamp(10px,3cqmin,19px);background:var(--paper);color:var(--text);font-size:clamp(16px,7.5cqmin,37px);font-weight:850;line-height:1.05;overflow-wrap:anywhere}
.choice:active{background:var(--soft);transform:scale(.98)}
.sight-grid{flex:none;width:min(96cqw,calc(100cqh - 70px));max-width:100%;aspect-ratio:1;display:grid;gap:clamp(3px,1.6cqmin,10px)}.sight-cell{min-width:0;min-height:0;border:0;border-radius:13%;padding:0;touch-action:manipulation}
.sequence-items{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(4px,1.8cqmin,11px);max-width:100%;width:100%}
.sequence-number{display:grid;place-items:center;min-width:clamp(40px,14cqmin,95px);min-height:clamp(43px,15cqmin,95px);padding:clamp(5px,1.7cqmin,12px);background:var(--paper);border:1.5px solid var(--line);border-radius:clamp(10px,2.8cqmin,18px);font-size:clamp(19px,9cqmin,53px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.sequence-number.missing{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.feedback-mark{font-size:clamp(42px,22cqmin,130px);font-weight:900;line-height:1}.feedback{max-width:98%;font-size:clamp(20px,11cqmin,52px);font-weight:900;line-height:1.05;overflow-wrap:anywhere}.feedback-time{font-size:clamp(17px,8cqmin,40px);font-weight:800;font-variant-numeric:tabular-nums}
#floating{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:calc(10px + env(safe-area-inset-left));z-index:3;display:flex;align-items:center;gap:5px;padding:3px 3px 3px 9px;border:1px solid var(--line);border-radius:99px;background:var(--paper);color:var(--text);box-shadow:0 3px 12px #0002;font-size:12px;font-weight:850;white-space:nowrap;font-variant-numeric:tabular-nums}
#floating button{height:30px;width:30px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--soft);color:var(--text);font-weight:800}
#overlay{position:fixed;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#overlay.off{display:none}.shell{max-width:800px;margin:0 auto}.shell-home{max-width:750px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 19px}
.site-title{font-size:clamp(30px,7vw,48px);letter-spacing:-.05em;line-height:1.04;font-weight:900;margin:0}
.theme-button{min-width:48px;height:44px;padding:0 10px;display:flex;align-items:center;gap:7px;justify-content:center;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:14px;font-size:20px;font-weight:850}
.theme-button .theme-label{font-size:12px;font-weight:750;color:var(--muted)}
.home-intro{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.35}
.mode-list{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.mode-card{position:relative;min-width:0;min-height:132px;display:grid;grid-template-columns:minmax(0,1fr) 112px;align-items:center;gap:14px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:22px;background:var(--paper);color:var(--text)}
.mode-card.featured{background:color-mix(in srgb,var(--accent) 8%,var(--paper));border-color:color-mix(in srgb,var(--accent) 26%,var(--line))}
.mode-card.featured:nth-child(2){background:color-mix(in srgb,var(--p2) 9%,var(--paper));border-color:color-mix(in srgb,var(--p2) 26%,var(--line))}
.mode-copy{min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mode-card strong{font-size:clamp(19px,2.8vw,23px);line-height:1.08;letter-spacing:-.03em;overflow-wrap:anywhere}
.mode-card .desc{font-size:clamp(13px,2.1vw,15px);color:var(--muted);line-height:1.35;letter-spacing:-.005em}
.mode-preview{width:112px;height:92px;border-radius:18px;border:1px solid color-mix(in srgb,var(--text) 8%,var(--line));background:color-mix(in srgb,var(--soft) 70%,var(--paper));display:grid;place-items:center;padding:10px;overflow:hidden}
.mode-preview .mini-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mode-preview .mini-grid span{display:block;border-radius:7px;background:#a95ae0}
.mode-preview .mini-grid span.alt{background:#7c2cb4}
.mode-preview .mini-seq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;width:100%}
.mode-preview .mini-seq b,.mode-preview .mini-seq i{display:grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-style:normal;font-weight:850}
.mode-preview .mini-seq i{background:color-mix(in srgb,var(--accent) 12%,var(--paper));color:var(--accent)}
.mode-preview .mini-words{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;width:100%}
.mode-preview .mini-words span{padding:3px 7px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:12px;font-weight:800}
.mode-preview .mini-lights{display:flex;gap:9px}.mode-preview .mini-lights span{width:22px;height:22px;border-radius:50%;background:#f1c250}.mode-preview .mini-lights span:last-child{background:#62d88a}
.mode-preview .mini-eq{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;width:100%;font-size:20px;font-weight:900;letter-spacing:-.04em}
.mode-preview .mini-eq b{font-size:22px}.mode-preview .mini-eq i{font-style:normal;color:var(--accent)}
.mode-preview .mini-color{font-size:20px;font-weight:900;letter-spacing:-.02em;color:#2f7ee3}
.mode-preview .mini-logic{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:100%}
.mode-preview .mini-logic span{display:grid;place-items:center;height:26px;border-radius:9px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:850}
.mode-preview .mini-logic span.ok{background:#dff6e7;border-color:#7fd0a2;color:#11663f}
.mode-card:active{transform:scale(.985)}
.back-link{border:0;background:none;color:var(--accent);font-size:16px;font-weight:800;padding:6px 0;margin-bottom:10px}
.setup{max-width:620px;margin:0 auto}.setup h2{font-size:clamp(27px,6vw,38px);line-height:1.12;letter-spacing:-.04em;margin:4px 0 4px}.mode-summary{font-size:14px;color:var(--muted);margin:0 0 23px}
.setting{padding:0 0 15px;margin:0 0 17px;border-bottom:1px solid var(--line)}.setting-title{font-size:16px;font-weight:850;margin:0 0 10px}
.segments{display:flex;gap:5px;border-radius:15px;padding:4px;background:var(--soft)}
.segments button{flex:1;min-width:0;min-height:45px;border:0;border-radius:11px;padding:8px 2px;background:transparent;color:var(--muted);font-weight:850;font-size:clamp(14px,3vw,17px)}
.segments button.active{background:var(--paper);color:var(--accent);box-shadow:0 2px 8px #0001}
.names-toggle{background:none;border:0;padding:12px 3px 0;color:var(--accent);font-size:14px;font-weight:800}.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.name-field{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.name-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--player)}
.name-field input{min-width:0;width:100%;padding:8px 0;border:0;background:transparent;color:var(--text);font-size:16px;outline:0}
.primary{width:100%;min-height:55px;border:0;border-radius:16px;margin-top:5px;background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:850}
.secondary{display:block;width:100%;min-height:49px;margin-top:10px;background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:15px;font-size:16px;font-weight:800}
.result-head{text-align:center;margin:20px 0}.result-head h2{font-size:clamp(30px,6vw,44px);letter-spacing:-.04em;margin:0 0 6px}.result-head p{margin:0;color:var(--muted)}
.ranks{display:grid;gap:8px}.rank{display:grid;grid-template-columns:28px 13px minmax(0,1fr) auto;align-items:center;gap:9px;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px}.rank .medal{font-size:24px}.rank .rankdot{height:12px;width:12px;border-radius:50%;background:var(--player)}.rank .points{font-size:19px;font-weight:900}.result-actions{margin-top:20px}
@media(min-width:690px){.mode-list{grid-template-columns:repeat(2,minmax(0,1fr))}.mode-card{min-height:140px}.topbar{margin-bottom:24px}}
@media(min-width:1000px){.mode-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:370px){.mode-list{gap:10px}.mode-card{grid-template-columns:minmax(0,1fr) 92px;padding:13px;min-height:122px}.mode-preview{width:92px;height:82px}.mode-card strong{font-size:17px}.mode-card .desc{font-size:12px}}
@media(orientation:landscape){
 #arena[data-players="2"]{grid-template:minmax(0,1fr)/repeat(2,minmax(0,1fr))}
 #arena[data-players="2"] .p0{grid-row:1;grid-column:2}#arena[data-players="2"] .p1{grid-row:1;grid-column:1}

 #arena[data-players="2"] .p0 .board{transform:rotate(90deg)}

}
@media(max-height:450px){#arena[data-players="4"] .board,#arena[data-players="3"] .board{gap:3px;padding-top:29px;padding-bottom:4px}.game-caption{font-size:clamp(14px,6cqmin,21px)}.game-main{font-size:clamp(23px,16cqmin,80px)}.choice{min-height:clamp(29px,13cqmin,65px)}.player-tag{padding:3px 8px}}
@media(orientation:landscape) and (max-height:500px){
 #arena[data-players="3"] .board.sight-layout,#arena[data-players="4"] .board.sight-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);align-items:center;justify-items:center;gap:6px;padding:30px 12px 7px}
 #arena[data-players="3"] .sight-layout .game-caption,#arena[data-players="4"] .sight-layout .game-caption{grid-column:1;grid-row:1;font-size:clamp(12px,5cqmin,20px)}
 #arena[data-players="3"] .sight-layout .sight-grid,#arena[data-players="4"] .sight-layout .sight-grid{grid-column:2;grid-row:1;width:min(100%,calc(100cqh - 8px));max-width:100%;align-self:center}
}

@media(orientation:landscape) and (max-height:350px){
 #arena[data-players="3"] .board.sequence-layout,#arena[data-players="4"] .board.sequence-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto;align-content:center;justify-items:center;gap:3px;padding:27px 6px 3px}
 #arena[data-players="3"] .sequence-layout .game-caption,#arena[data-players="4"] .sequence-layout .game-caption{grid-column:1;grid-row:1;align-self:end;font-size:clamp(11px,4cqmin,16px)}
 #arena[data-players="3"] .sequence-layout .sequence-items,#arena[data-players="4"] .sequence-layout .sequence-items{grid-column:1;grid-row:2;align-self:start;gap:2px}
 #arena[data-players="3"] .sequence-layout .sequence-number,#arena[data-players="4"] .sequence-layout .sequence-number{min-width:clamp(24px,8cqmin,40px);min-height:clamp(28px,8cqmin,42px);padding:3px;font-size:clamp(13px,6cqmin,21px);border-radius:7px}
 #arena[data-players="3"] .sequence-layout .choices,#arena[data-players="4"] .sequence-layout .choices{grid-column:2;grid-row:1/span 2;align-self:center;width:100%;gap:4px}
 #arena[data-players="3"] .sequence-layout .choice,#arena[data-players="4"] .sequence-layout .choice{min-height:42px;font-size:15px;padding:3px 2px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>

<body>
<main id="arena" data-players="1" aria-label="Spielfeld"></main>
<div id="floating" hidden><span id="round-indicator"></span><button id="pause-button" aria-label="Spiel pausieren">Ⅱ</button></div>
<div id="overlay"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const arena=$('#arena'), overlay=$('#overlay'), floating=$('#floating');
const random=n=>Math.floor(Math.random()*n);
const pick=a=>a[random(a.length)];
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=random(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function sample(a,n){return shuffle(a).slice(0,n)}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function read(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}
function save(k,value){try{localStorage.setItem(k,JSON.stringify(value))}catch{}}
function fmt(ms){return (ms/1000).toFixed(2).replace('.',',')+' s'}
const COLORS=[['ROT','#db4054'],['BLAU','#287ad6'],['GELB','#b58b04'],['GRÜN','#159063'],['LILA','#9962d7']];
const PLAYER_COLORS=['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const DIFFICULTIES=['Leicht','Mittel','Schwer'];
const GAMES={
  math:{icon:'＋',name:'Kopfrechnen',desc:'Plus · Minus · Mal',group:'brain'},
  memory:{icon:'▦',name:'Wörter merken',desc:'Einprägen · Erinnern · Wählen',group:'brain'},
  sequence:{icon:'↗',name:'Zahlenreihen',desc:'Zahlen · Muster · Ergänzen',group:'brain'},
  words:{icon:'Aa',name:'Wortsalat',desc:'Buchstaben · Ordnen · Wörter',group:'brain'},
  logic:{icon:'◇',name:'Zahlenlogik',desc:'Regeln · Zahlen · Finden',group:'brain'},
  go:{icon:'⚡',name:'Reaktion',desc:'Warten · Grün · Tippen',group:'speed'},
  color:{icon:'◉',name:'Schriftfarbe',desc:'Wort · Farbe · Wählen',group:'speed'},
  sight:{icon:'▦',name:'Farb-Sehtest',desc:'Farbfelder · Vergleichen · Finden',group:'speed'}
};
const MODES={
  brain:{icon:'✳',name:'Denkspiele',desc:'Rechnen · Merken · Logik'},
  mix:{icon:'✦',name:'Alle Spiele',desc:'Denken · Farben · Reaktion'},
  ...GAMES
};
const WORD_POOL=['Apfel','Blume','Brücke','Sonne','Tisch','Wolke','Buch','Lampe','Vogel','Fenster','Garten','Musik','Kerze','Schlüssel','Blatt','Kaffee','Mütze','Insel','Zug','Pferd','Uhr','Ball','Kissen','Kuchen','Baum','Tasse','Telefon','Berg','Schiff','Wasser','Schuhe','Mond','Wiese','Brot','Hund','Haus','Regen','Fahrrad','Karte'];
const ANAGRAMS={
  0:['HAUS','MAUS','BAUM','BUCH','BALL','BOOT','BROT','MOND','WALD','WIND','HAND','LAND'],
  1:['LAMPE','SONNE','TASSE','WOLKE','BLUME','KATZE','TISCH','STUHL','KERZE','APFEL','VOGEL','FARBE'],
  2:['GARTEN','BRILLE','KISSEN','KUCHEN','FENSTER','SCHULE','FREUND','BLUMEN','WINTER','SOMMER','WASSER','STRAND']
};
const DEFAULT={np:2,rounds:5,diff:1,theme:'auto',names:['','','','']};
let cfg={...DEFAULT,...read('bd_cfg',{})};
if(!Array.isArray(cfg.names))cfg.names=['','','',''];
if(!['auto','light','dark'].includes(cfg.theme))cfg.theme='auto';
let best=read('bd_best',{}), match=null, audio=null;
function label(p){return (cfg.names[p]||'').trim()||'Spieler '+(p+1)}
function beep(f=660,sec=.1){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),a=audio.createGain();o.frequency.value=f;o.type='sine';a.gain.value=.075;a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+sec);o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+sec)}catch{}}
function applyTheme(){document.documentElement.dataset.theme=cfg.theme;const dark=cfg.theme==='dark'||(cfg.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);$('meta[name="theme-color"]').content=dark?'#101723':'#f6f8fc'}
applyTheme();
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
function themeControl(){let themeText={auto:'Auto',light:'Hell',dark:'Dunkel'};let themeIcon={auto:'◐',light:'☀',dark:'☾'};return `<button class="theme-button" id="theme-toggle" type="button" aria-label="Darstellung: ${themeText[cfg.theme]}. Tippen zum Wechseln"><span aria-hidden="true">${themeIcon[cfg.theme]}</span><span class="theme-label">${themeText[cfg.theme]}</span></button>`}
function bar(){return `<header class="topbar"><h1 class="site-title">Blitz Duell</h1>${themeControl()}</header>`}
function hookTheme(){let b=$('#theme-toggle');if(b)b.onclick=()=>{cfg.theme={auto:'light',light:'dark',dark:'auto'}[cfg.theme];save('bd_cfg',cfg);applyTheme();const fresh=document.createElement('div');fresh.innerHTML=themeControl();b.replaceWith(fresh.firstChild);hookTheme()}}
function stopTimer(){if(match){clearTimeout(match.timer);match.timer=null}}
function home(){stopTimer();match=null;arena.innerHTML='';arena.dataset.scene='idle';floating.hidden=true;
  const preview=(key)=>({
    brain:`<div class="mode-preview"><div class="mini-seq"><b>5</b><b>8</b><b>11</b><i>?</i></div></div>`,
    mix:`<div class="mode-preview"><div class="mini-grid"><span style="background:#69d58e"></span><span style="background:#8d61da"></span><span style="background:#f0b546"></span><span style="background:#ea7c68"></span><span class="alt"></span><span style="background:#59a0f2"></span><span style="background:#5cc8a5"></span><span style="background:#ef8fb2"></span><span style="background:#a95ae0"></span></div></div>`,
    math:`<div class="mode-preview"><div class="mini-eq"><b>8</b><span>+</span><b>5</b><i>= ?</i></div></div>`,
    memory:`<div class="mode-preview"><div class="mini-words"><span>Blume</span><span>Brücke</span><span>Wiese</span></div></div>`,
    sequence:`<div class="mode-preview"><div class="mini-seq"><b>3</b><b>6</b><b>9</b><i>?</i></div></div>`,
    words:`<div class="mode-preview"><div class="mini-seq"><b>S</b><b>U</b><b>A</b><b>H</b><i>?</i></div></div>`,
    logic:`<div class="mode-preview"><div class="mini-logic"><span>14</span><span>19</span><span class="ok">24</span><span>27</span></div></div>`,
    go:`<div class="mode-preview"><div class="mini-lights"><span></span><span></span><span></span></div></div>`,
    color:`<div class="mode-preview"><div class="mini-color">BLAU</div></div>`,
    sight:`<div class="mode-preview"><div class="mini-grid">${Array.from({length:9},(_,i)=>`<span class="${i===4?'alt':''}"></span>`).join('')}</div></div>`
  }[key]);
  const modeCard=(key,featured=false)=>{let t=MODES[key];return `<button class="mode-card ${featured?'featured':''}" data-mode="${key}"><div class="mode-copy"><strong>${t.name}</strong><span class="desc">${t.desc}</span></div>${preview(key)}</button>`};
  overlay.innerHTML=`<div class="shell shell-home">${bar()}<p class="home-intro">Wähle ein Spiel. Tippen und direkt loslegen.</p><div class="mode-list">${['brain','mix','math','memory','sequence','words','logic','go','color','sight'].map((k,i)=>modeCard(k,i<2)).join('')}</div></div>`;
  overlay.classList.remove('off');hookTheme();overlay.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setup(b.dataset.mode));overlay.scrollTop=0;
}
function segments(key,values,labels){return `<div class="segments" role="group">${values.map((v,i)=>`<button type="button" data-option="${key}" data-value="${v}" class="${cfg[key]===v?'active':''}" aria-pressed="${cfg[key]===v}">${labels?labels[i]:v}</button>`).join('')}</div>`}
function setup(mode,showNames=false){let meta=MODES[mode];
  overlay.innerHTML=`<div class="shell">${bar()}<div class="setup"><button class="back-link" id="back">‹ Alle Spiele</button><h2>${meta.name}</h2><p class="mode-summary">${meta.desc}</p><div class="setting"><div class="setting-title">Spieler</div>${segments('np',[1,2,3,4])}${cfg.np>1?`<button class="names-toggle" id="names-toggle" aria-expanded="${showNames}">Namen ${showNames?'ausblenden −':'eingeben +'}</button><div class="names" id="name-fields" ${showNames?'':'hidden'}>${Array.from({length:cfg.np},(_,p)=>`<label class="name-field" style="--player:${PLAYER_COLORS[p]}"><span class="name-dot"></span><input data-player-name="${p}" maxlength="14" aria-label="Name von Spieler ${p+1}" placeholder="Spieler ${p+1}" value="${escapeHTML(cfg.names[p]||'')}"></label>`).join('')}</div>`:''}</div><div class="setting"><div class="setting-title">Runden</div>${segments('rounds',[3,5,10,20])}</div><div class="setting"><div class="setting-title">Schwierigkeit</div>${segments('diff',[0,1,2],DIFFICULTIES)}</div><button class="primary" id="start">Spiel starten</button></div></div>`;
  overlay.classList.remove('off');overlay.scrollTop=0;hookTheme();
  overlay.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{cfg[b.dataset.option]=Number(b.dataset.value);save('bd_cfg',cfg);setup(mode,showNames)});
  overlay.querySelectorAll('[data-player-name]').forEach(b=>b.oninput=()=>{cfg.names[+b.dataset.playerName]=b.value;save('bd_cfg',cfg)});
  let namesToggle=$('#names-toggle');if(namesToggle)namesToggle.onclick=()=>{let expanded=namesToggle.getAttribute('aria-expanded')!=='true';namesToggle.setAttribute('aria-expanded',String(expanded));namesToggle.textContent=expanded?'Namen ausblenden −':'Namen eingeben +';$('#name-fields').hidden=!expanded};
  $('#back').onclick=home;$('#start').onclick=()=>start(mode);
}
function start(mode){stopTimer();const n=cfg.np;match={mode,players:n,rounds:cfg.rounds,diff:cfg.diff,round:0,scores:Array(n).fill(0),times:Array.from({length:n},()=>[]),locked:Array(n).fill(false),feedback:Array(n).fill(null),winner:-1,phase:'intro',type:null,answer:null,view:null,timer:null,startedAt:0,record:false};
  arena.dataset.players=String(n);arena.dataset.scene='idle';arena.innerHTML=Array.from({length:n},(_,p)=>`<section class="player-card p${p}" data-p="${p}" style="--player:${PLAYER_COLORS[p]}"><div class="board"></div></section>`).join('');
  overlay.classList.add('off');floating.hidden=false;floating.dataset.players=String(n);countIn(3);
}
function render(){if(!match)return;let M=match;$('#round-indicator').textContent=`${Math.min(Math.max(1,M.round),M.rounds)} / ${M.rounds}`;
  arena.querySelectorAll('.player-card').forEach(card=>{let p=+card.dataset.p,fb=M.feedback[p],v=M.view||{};
    card.classList.toggle('winner',M.winner===p);card.classList.toggle('wrong',!!(fb&&fb.kind==='wrong'));card.classList.toggle('missed',!!(fb&&fb.kind==='missed'));
    let body='';
    if(fb){body=`<div class="feedback-mark" aria-hidden="true">${fb.kind==='win'?'✓':fb.kind==='wrong'?'✕':'·'}</div><div class="feedback">${escapeHTML(fb.message)}</div>${fb.time!=null?`<div class="feedback-time">${fmt(fb.time)}</div>`:''}`}
    else{
      body=`<div class="game-caption">${escapeHTML(v.title||'')}</div>`;
      if(v.main!=null)body+=`<div class="game-main ${v.mainColor?'colored':''}" ${v.mainColor?`style="color:${v.mainColor}"`:''}>${escapeHTML(v.main)}</div>`;
      if(v.series)body+=`<div class="sequence-items" aria-label="Zahlenfolge ${escapeHTML(v.series.join(', '))}, welche Zahl folgt?">${[...v.series,'?'].map((n,i)=>`<span class="sequence-number${i===v.series.length?' missing':''}">${escapeHTML(n)}</span>`).join('')}</div>`;
      if(v.words)body+=`<div class="memory-items">${v.words.map(w=>`<span>${escapeHTML(w)}</span>`).join('')}</div>`;
      if(v.subtitle)body+=`<div class="game-sub">${escapeHTML(v.subtitle)}</div>`;
      if(v.options)body+=`<div class="choices">${v.options.map(o=>`<button class="choice" data-answer="${escapeHTML(o)}">${escapeHTML(o)}</button>`).join('')}</div>`;
      if(v.grid)body+=`<div class="sight-grid" style="grid-template-columns:repeat(${v.grid.n},1fr)">${Array.from({length:v.grid.n*v.grid.n},(_,i)=>`<button class="sight-cell" data-answer="${i}" aria-label="Feld ${i+1}" style="background:hsl(${v.grid.hue} 68% ${i===v.grid.odd?v.grid.alt:55}%)"></button>`).join('')}</div>`;
    }
    card.querySelector('.board').classList.toggle('sight-layout',!!v.grid&&!fb);
    card.querySelector('.board').classList.toggle('sequence-layout',!!v.series&&!fb);
    card.querySelector('.board').innerHTML=`<div class="player-tag"><span class="dot"></span><span class="label">${escapeHTML(M.players===1?'Du':label(p))}</span><b>${M.scores[p]}</b></div>${body}`;
  });
}
function countIn(n){if(!match)return;match.phase='intro';match.locked.fill(false);match.feedback.fill(null);match.winner=-1;arena.dataset.scene='idle';match.view={title:'Bereit?',main:String(n)};render();beep(400,.06);match.timer=setTimeout(()=>{if(!match)return;n>1?countIn(n-1):nextRound()},700)}
function nextRound(){if(!match)return;stopTimer();if(match.round>=match.rounds){finish();return}
  let M=match;M.round++;M.locked=Array(M.players).fill(false);M.feedback=Array(M.players).fill(null);M.winner=-1;arena.dataset.scene='idle';
  let pool=M.mode==='mix'?Object.keys(GAMES):M.mode==='brain'?['math','memory','sequence','words','logic']: [M.mode];
  M.type=pick(pool);M.phase='prepare';M.answer=null;
  if(M.type==='go'){
    M.phase='wait';arena.dataset.scene='wait';M.view={title:'Warte auf Grün',main:'✋'};render();
    let delay=[1600,1200,900][M.diff]+random([2300,3000,4000][M.diff]);M.timer=setTimeout(()=>{
      if(!match)return;
      if(M.diff>0&&random(3)===0){arena.dataset.scene='warn';M.view={title:'Noch warten!',main:'●'};render();M.timer=setTimeout(()=>{if(!match)return;arena.dataset.scene='wait';M.view={title:'Warte auf Grün',main:'✋'};render();M.timer=setTimeout(startLive,700+random(1600))},650)}
      else startLive();
    },delay);
    return;
  }
  let challenge=generate(M.type,M.diff);M.answer=challenge.answer;
  if(challenge.preview){M.phase='memorize';M.view=challenge.preview;render();let previewMs=[4400,5300,6500][M.diff];M.timer=setTimeout(()=>{if(!match)return;M.view=challenge.view;startLive()},previewMs)}
  else{M.phase='prepare';M.view={title:'Bereit?',main:GAMES[M.type].icon};render();M.timer=setTimeout(()=>{if(!match)return;M.view=challenge.view;startLive()},850)}
}
function startLive(){if(!match)return;let M=match;M.phase='live';M.startedAt=performance.now();arena.dataset.scene=M.type==='go'?'live':'idle';if(M.type==='go')M.view={title:'JETZT!',main:'⚡'};render();beep(750,.09);
  let seconds=M.type==='go'?2.8:(M.type==='sight'||M.type==='color'? [14,12,10][M.diff] :[23,19,16][M.diff]);
  M.timer=setTimeout(()=>endRound(-1),seconds*1000);
}
function generate(type,d){
  if(type==='math'){
    const op=pick(d===0?['+','-']:['+','-','×']),max=[12,25,60][d];let a,b,result;
    if(op==='×'){a=2+random(d===2?12:8);b=2+random(d===2?12:8);result=a*b}
    else {a=2+random(max);b=2+random(max);if(op==='-'&&b>a)[a,b]=[b,a];result=op==='+'?a+b:a-b}
    return {answer:String(result),view:{title:'Ergebnis?',main:`${a} ${op} ${b} = ?`,options:numberOptions(result,op==='×'?12:7)}};
  }
  if(type==='memory'){
    let list=sample(WORD_POOL,[3,4,5][d]),target=pick(list),other=sample(WORD_POOL.filter(w=>!list.includes(w)),3);
    return {answer:target,preview:{title:'Wörter merken',words:list},view:{title:'Welches Wort war dabei?',options:shuffle([target,...other])}};
  }
  if(type==='sequence'){
    let series=[],answer;
    if(d===0){let x=2+random(13),step=2+random(5);series=Array.from({length:4},(_,i)=>x+i*step);answer=x+4*step}
    else if(d===1){let x=2+random(10),step1=2+random(4),step2=step1+2+random(4);series=[x,x+step1,x+step1+step2,x+2*step1+step2,x+2*step1+2*step2];answer=series[4]+step1}
    else{let x=2+random(5),inc=2+random(3);series=[x];for(let i=1;i<5;i++)series.push(series[i-1]+inc*i);answer=series[4]+inc*5}
    return{answer:String(answer),view:{title:'Nächste Zahl?',series,options:numberOptions(answer,[5,10,18][d])}};
  }
  if(type==='words'){
    let selection=sample(ANAGRAMS[d],4),answer=selection[0],letters=answer.split(''),mixed;
    do{mixed=shuffle(letters).join('')}while(mixed===answer);
    return{answer,view:{title:'Welches Wort?',main:mixed.split('').join(' '),options:shuffle(selection)}};
  }
  if(type==='logic'){
    let pool=Array.from({length:80},(_,i)=>i+1),pred,title;
    if(d===0){let n=10+2*random(10);title=`Gerade Zahl über ${n}?`;pred=x=>x%2===0&&x>n}
    else if(d===1){let lo=12+random(8),hi=lo+12;title=`Durch 3 teilbar · ${lo} bis ${hi}?`;pred=x=>x>lo&&x<hi&&x%3===0}
    else{let lo=16+random(15),hi=lo+24;title=`Durch 4 teilbar · ${lo} bis ${hi}?`;pred=x=>x>lo&&x<hi&&x%4===0}
    let good=pick(pool.filter(pred)),bad=sample(pool.filter(x=>!pred(x)&&Math.abs(x-good)<22),3);
    if(bad.length<3)bad=sample(pool.filter(x=>!pred(x)),3);
    return{answer:String(good),view:{title,options:shuffle([good,...bad].map(String))}};
  }
  if(type==='color'){
    let word=random(COLORS.length),ink;do{ink=random(COLORS.length)}while(ink===word);
    let rest=sample(COLORS.map((_,i)=>i).filter(i=>i!==ink&&i!==word),2);
    return{answer:COLORS[ink][0],view:{title:'Schriftfarbe?',main:COLORS[word][0],mainColor:COLORS[ink][1],options:shuffle([ink,word,...rest].map(i=>COLORS[i][0]))}};
  }
  if(type==='sight'){
    let n=3+d,hue=random(360),odd=random(n*n),delta=[24,17,12][d],alt=55+(random(2)?delta:-delta);
    return{answer:String(odd),view:{title:'Anderes Feld?',grid:{n,hue,odd,alt}}};
  }
}
function numberOptions(correct,offset){let a=new Set([correct]);let tries=0;while(a.size<4&&tries++<100){let v=correct+(random(2)?1:-1)*(1+random(offset));if(v>=0)a.add(v)}return shuffle([...a].map(String))}
function hit(player,answer){let M=match;if(!M||M.locked[player])return;
  if(M.type==='go'&&(M.phase==='wait'||M.phase==='prepare')){lock(player,'Zu früh!');return}
  if(M.phase!=='live')return;
  let elapsed=performance.now()-M.startedAt;
  if(M.type==='go'){endRound(player,elapsed);return}
  if(answer==null)return;
  if(answer===M.answer)endRound(player,elapsed);else lock(player,'Falsch!');
}
function lock(player,message){let M=match;if(!M)return;M.locked[player]=true;M.feedback[player]={message,kind:'wrong'};beep(240,.17);
  if(M.locked.every(Boolean))endRound(-1);else render();
}
function endRound(winner,time){if(!match||match.phase==='result'||match.phase==='end')return;stopTimer();let M=match;M.phase='result';M.winner=winner;arena.dataset.scene='idle';
  if(winner>=0){M.scores[winner]++;M.times[winner].push(time);M.feedback[winner]={message:'Richtig! +1',kind:'win',time};let k=M.type+M.diff;
    if(best[k]==null||time<best[k]){best[k]=time;save('bd_best',best);M.record=true}beep(860,.18)}
  for(let p=0;p<M.players;p++)if(p!==winner&&!M.feedback[p])M.feedback[p]={message:winner<0?'Zeit um!':'Zu langsam',kind:'missed'};
  render();M.timer=setTimeout(nextRound,1600);
}
function finish(){let M=match;if(!M)return;M.phase='end';arena.dataset.scene='idle';floating.hidden=true;
  let ranking=Array.from({length:M.players},(_,p)=>{let ts=M.times[p];return{p,points:M.scores[p],avg:ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:Infinity}}).sort((a,b)=>b.points-a.points||a.avg-b.avg);
  let top=ranking[0],joint=M.players>1&&ranking.length>1&&ranking[1].points===top.points;
  let title=M.players===1?'Fertig!':joint?'Unentschieden!':escapeHTML(label(top.p))+' gewinnt!';
  overlay.innerHTML=`<div class="shell">${bar()}<div class="setup"><div class="result-head"><h2>${title}</h2><p>${M.rounds} Runden</p></div><div class="ranks">${ranking.map((r,i)=>`<div class="rank" style="--player:${PLAYER_COLORS[r.p]}"><span class="medal">${['🥇','🥈','🥉','4.'][i]}</span><span class="rankdot"></span><strong>${escapeHTML(M.players===1?'Du':label(r.p))}</strong><span class="points">${r.points} Pkt.</span></div>`).join('')}</div><div class="result-actions"><button class="primary" id="again">Noch einmal</button><button class="secondary" id="to-home">Alle Spiele</button></div></div></div>`;
  overlay.classList.remove('off');overlay.scrollTop=0;hookTheme();beep(1000,.2);$('#again').onclick=()=>start(M.mode);$('#to-home').onclick=home;
}
function pause(){if(!match||match.phase==='end'||match.phase==='pause')return;let M=match;stopTimer();M.pausedPhase=M.phase;M.phase='pause';
  overlay.innerHTML=`<div class="shell"><div class="setup" style="padding-top:min(15vh,90px)"><h2>Pause</h2><p class="mode-summary">Runde ${Math.max(1,M.round)} von ${M.rounds}</p><button class="primary" id="resume">Weiter</button><button class="secondary" id="quit">Beenden</button></div></div>`;
  overlay.classList.remove('off');$('#resume').onclick=()=>{overlay.classList.add('off');if(M.pausedPhase==='intro'){countIn(3);return}if(M.pausedPhase==='result'){nextRound();return}M.round=Math.max(0,M.round-1);nextRound()};$('#quit').onclick=home;
}
arena.addEventListener('pointerdown',e=>{let card=e.target.closest('.player-card');if(!card)return;if(e.target.closest('.choice,.sight-cell'))e.preventDefault();let button=e.target.closest('[data-answer]');hit(+card.dataset.p,button?button.dataset.answer:null)});
$('#pause-button').onclick=pause;
document.addEventListener('gesturestart',e=>{if(!overlay.classList.contains('off'))return;e.preventDefault()});
home();
</script>
</body>
