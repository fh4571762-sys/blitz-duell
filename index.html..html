<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Blitz Duell</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blitz Duell">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0c18">
<style>
:root{--bg:#0a0c18;--pn:#151a36;--tx:#f3f5ff;--mut:#8b92c4;--ok:#3ddc97;--bad:#ff6b6b;--c0:#ff4d8d;--c1:#4dc3ff;--c2:#ffc94d;--c3:#b388ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0c18;--pn:#151a36;--tx:#f3f5ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{height:100%;margin:0;color:var(--tx);font-family:-apple-system,"SF Pro Rounded",system-ui,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 15% 0%,#241a52 0,transparent 55%),radial-gradient(100% 70% at 100% 100%,#0e2c52 0,transparent 55%),var(--bg)}
#game{height:100%;display:grid;gap:8px;padding:8px}
.n1{grid-template:1fr/1fr}.n2{grid-template:1fr 1fr/1fr}.n3,.n4{grid-template:1fr 1fr/1fr 1fr}
.cell.span{grid-column:span 2}
.cell{container-type:size;position:relative;border-radius:26px;background:var(--pn);border:2px solid color-mix(in srgb,var(--pc) 45%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;transition:background .15s,box-shadow .2s,opacity .2s}
.cell.rot{transform:rotate(180deg)}
.cell.lk{opacity:.55}
.cell.win{box-shadow:0 0 0 3px var(--ok),0 0 34px rgba(61,220,151,.45)}
#game[data-s=wait] .cell{background:#3a1220}
#game[data-s=warn] .cell{background:#4a3510}
#game[data-s=live] .cell{background:#0e5a3a}
.hd{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700;background:rgba(0,0,0,.32);padding:5px 12px;border-radius:99px;white-space:nowrap}
.hd i{width:10px;height:10px;border-radius:50%;background:var(--pc)}.hd b{color:var(--pc);font-size:15px}
.t{font-size:clamp(15px,6cqmin,26px);font-weight:700;text-align:center;padding:30px 10px 0}
.big{font-size:clamp(34px,19cqmin,88px);font-weight:900;line-height:1;text-align:center}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:92%;max-width:420px}
.opt{flex:1 1 40%;font:inherit;font-size:clamp(18px,8cqmin,34px);font-weight:800;color:var(--tx);background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);border-radius:18px;padding:clamp(10px,4cqmin,20px) 4px}
.opt:active{transform:scale(.95);background:rgba(255,255,255,.24)}
.grid{display:grid;gap:5px;width:min(92cqw,56cqh);aspect-ratio:1}
.tile{border:0;border-radius:14%;padding:0}.tile:active{transform:scale(.93)}
#chip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;display:flex;align-items:center;gap:8px;background:rgba(10,12,24,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:5px 5px 5px 14px;font-weight:800;font-size:14px}
#chip[data-n="1"]{top:calc(env(safe-area-inset-top,0px) + 16px);left:auto;right:14px;transform:none}
#chip button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:var(--tx);font-size:13px}
#ov{position:fixed;inset:0;z-index:6;overflow:auto;display:flex;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));background:rgba(10,12,24,.95);-webkit-overflow-scrolling:touch}
#ov.hide{display:none}
.wrap{margin:auto;width:100%;max-width:720px;text-align:center}
h1{font-size:clamp(40px,11vw,60px);margin:0;font-weight:900;letter-spacing:1px;line-height:1;background:linear-gradient(90deg,var(--c0),var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:10px 0 20px;line-height:1.4}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:700px){.modes{grid-template-columns:repeat(4,1fr)}}
.mc{font:inherit;color:var(--tx);text-align:left;background:var(--pn);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:4px}
.mc:active{transform:scale(.97)}
.mc.mix{grid-column:1/-1;background:linear-gradient(120deg,#5b2a8f,#1f5fa8)}
.mc .ic{font-size:32px}.mc b{font-size:18px}.mc span{font-size:12.5px;color:var(--mut);line-height:1.35}.mc.mix span{color:#dfe4ff}
.row{margin:20px 0 8px;text-align:left;font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.seg{display:flex;background:var(--pn);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;font:inherit;font-weight:800;font-size:17px;color:var(--mut);background:none;border:0;border-radius:12px;padding:13px 4px}
.seg button.on{background:linear-gradient(120deg,var(--c0),var(--c1));color:#0a0c18}
.hint{color:var(--mut);font-size:13px;margin:8px 2px 0;text-align:left}
.go{width:100%;font:inherit;font-size:21px;font-weight:800;color:#0a0c18;background:linear-gradient(90deg,var(--c0),var(--c1));border:0;border-radius:18px;padding:18px;margin-top:26px;box-shadow:0 8px 30px rgba(77,195,255,.28)}
.go:active{transform:scale(.97)}.go.alt{background:var(--pn);color:var(--tx);box-shadow:none;margin-top:10px;font-size:17px;padding:14px}
.back{font:inherit;font-weight:700;color:var(--c1);background:none;border:0;padding:6px 0;float:left}
.rk{display:grid;grid-template-columns:36px 14px 1fr auto;align-items:center;gap:8px;background:var(--pn);border-radius:18px;padding:12px 14px;margin-bottom:10px;text-align:left;border:1px solid color-mix(in srgb,var(--pc) 50%,transparent)}
.rk i{width:12px;height:12px;border-radius:50%;background:var(--pc)}.rk .pt{font-weight:900;font-size:20px;color:var(--pc)}.rk small{grid-column:2/-1;color:var(--mut)}.md{font-size:24px}
.tip{font-size:12px;color:var(--mut);margin-top:18px}
</style>
</head>
<body>
<div id="game" class="n1"></div>
<div id="chip" hidden><span id="rc"></span><button id="pz" aria-label="Pause">⏸</button></div>
<div id="ov"></div>
<script>
const $=s=>document.querySelector(s),game=$('#game'),ov=$('#ov'),chip=$('#chip');
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)],shuf=a=>a.sort(()=>Math.random()-.5);
const fmt=ms=>(ms/1000).toFixed(3).replace('.',',')+' s';
const ST={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TYPES={go:['⚡','Reaktion','Tippe, sobald es grün wird'],math:['🧮','Kopfrechnen','Das richtige Ergebnis wählen'],color:['🎨','Farbe','Schriftfarbe statt Wort tippen'],sight:['👁️','Sehtest','Finde das Feld, das anders ist']};
const DIFF=['Leicht','Mittel','Schwer'],COL=[['ROT','#ff4d6d'],['BLAU','#4dabff'],['GELB','#ffd23f'],['GRÜN','#3ddc97'],['LILA','#b388ff']];
const HINT={1:'Solo: Jage deine Bestzeit.',2:'Handy flach zwischen euch legen – jeder hat seine Hälfte.',3:'Am besten auf dem iPad in der Tischmitte.',4:'Am besten auf dem iPad: je zwei Spieler gegenüber.'};
const LAY={1:[[0,0]],2:[[1,1],[0,0]],3:[[2,1,1],[0,0],[1,0]],4:[[3,1],[2,1],[0,0],[1,0]]};
let cfg=Object.assign({np:2,rounds:5,diff:1},ST.get('bd_cfg',{})),best=ST.get('bd_best',{}),G=null,AC;
function beep(f,d=.12){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.14;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const scene=s=>game.dataset.s=s, show=()=>ov.classList.remove('hide');
document.addEventListener('gesturestart',e=>e.preventDefault());

function home(){
  G=null;game.innerHTML='';chip.hidden=true;scene('idle');
  ov.innerHTML=`<div class="wrap"><h1>BLITZ<br>DUELL</h1><p class="sub">Reaktion · Köpfchen · Tempo<br>Allein oder mit bis zu 4 Freunden</p><div class="modes">
  <button class="mc mix" data-m="mix"><div class="ic">🎲</div><b>Mix-Duell</b><span>Alle vier Spiele zufällig gemischt</span></button>
  ${Object.entries(TYPES).map(([k,v])=>`<button class="mc" data-m="${k}"><div class="ic">${v[0]}</div><b>${v[1]}</b><span>${v[2]}${best[k+cfg.diff]?`<br>🏅 ${fmt(best[k+cfg.diff])} · ${DIFF[cfg.diff]}`:''}</span></button>`).join('')}
  </div><p class="tip">Tipp: Teilen → „Zum Home-Bildschirm“ für Vollbild wie eine echte App.</p></div>`;
  show();ov.querySelectorAll('.mc').forEach(b=>b.onclick=()=>setup(b.dataset.m));
}
function setup(m){
  const seg=(k,vals,lab)=>`<div class="seg">${vals.map((v,i)=>`<button data-k="${k}" data-v="${v}" class="${cfg[k]===v?'on':''}">${lab?lab[i]:v}</button>`).join('')}</div>`;
  const T=m==='mix'?['🎲','Mix-Duell','Alle vier Spiele zufällig gemischt']:TYPES[m];
  ov.innerHTML=`<div class="wrap"><button class="back" id="bk">‹ Zurück</button><div style="clear:both;height:6px"></div><h1 style="font-size:38px">${T[0]} ${T[1]}</h1><p class="sub">${T[2]}</p>
  <div class="row">Spieler</div>${seg('np',[1,2,3,4])}<p class="hint">${HINT[cfg.np]}</p>
  <div class="row">Durchgänge</div>${seg('rounds',[3,5,10,20])}
  <div class="row">Schwierigkeit</div>${seg('diff',[0,1,2],DIFF)}
  <button class="go" id="st">Los geht’s ⚡</button></div>`;
  ov.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{cfg[b.dataset.k]=+b.dataset.v;ST.set('bd_cfg',cfg);setup(m)});
  $('#bk').onclick=home;$('#st').onclick=()=>start(m);
}
function start(m){
  const n=cfg.np;
  G={m,np:n,rounds:cfg.rounds,diff:cfg.diff,round:0,score:Array(n).fill(0),times:Array.from({length:n},()=>[]),lk:[],st:[],V:{},win:-1,rec:false};
  game.className='n'+n;
  game.innerHTML=LAY[n].map(([p,r,s])=>`<div class="cell${r?' rot':''}${s?' span':''}" data-p="${p}" style="--pc:var(--c${p})"></div>`).join('');
  ov.classList.add('hide');chip.hidden=false;chip.dataset.n=n;count(3);
}
function paint(){
  document.querySelectorAll('.cell').forEach(c=>{
    const p=+c.dataset.p,v=G.st[p]||G.V;
    c.classList.toggle('lk',!!G.lk[p]);c.classList.toggle('win',G.win===p);
    c.innerHTML=`<div class="hd"><i></i>${G.np>1?'Spieler '+(p+1):'Treffer'} <b>${G.score[p]}</b></div><div class="t" style="color:${v.tc||'inherit'}">${v.t||''}</div>`
    +(v.b!=null?`<div class="big" style="color:${v.c||'inherit'}">${v.b}</div>`:'')
    +(v.o?`<div class="opts">${v.o.map(x=>`<button class="opt" data-v="${x}">${x}</button>`).join('')}</div>`:'')
    +(v.g?`<div class="grid" style="grid-template-columns:repeat(${v.n},1fr)">${v.g}</div>`:'');
  });
  $('#rc').textContent=Math.max(1,G.round)+' / '+G.rounds;
}
function count(n){G.phase='count';scene('idle');G.V={t:'Macht euch bereit',b:n};G.st=[];G.lk=[];G.win=-1;paint();beep(440,.1);G.timer=setTimeout(()=>n>1?count(n-1):nextRound(),750)}
function nextRound(){
  clearTimeout(G.timer);
  if(G.round>=G.rounds)return finish();
  G.round++;G.lk=[];G.st=[];G.win=-1;
  const T=G.type=G.m==='mix'?pick(Object.keys(TYPES)):G.m,d=G.diff,W={t:'Warte auf GRÜN…',b:'✋'};
  if(T==='go'){
    G.phase='wait';scene('wait');G.V=W;paint();
    const w1=[1500,1000,800][d]+rnd([2000,3000,4500][d]);
    if(d&&Math.random()<d*.3)G.timer=setTimeout(()=>{scene('warn');G.V={t:'Vorsicht…',b:'🟠'};paint();G.timer=setTimeout(()=>{scene('wait');G.V=W;paint();G.timer=setTimeout(live,800+rnd(1500))},700)},w1);
    else G.timer=setTimeout(live,w1);
  }else{
    G.phase='ready';scene('idle');G.V={t:{math:'Kopfrechnen!',color:'Schriftfarbe!',sight:'Such das andere Feld!'}[T],b:'👀'};paint();
    G.timer=setTimeout(()=>{G.V=gen(T,d);live()},900);
  }
}
function live(){
  G.phase='live';G.t0=performance.now();
  if(G.type==='go'){scene('live');G.V={t:'JETZT!',b:'⚡'}}
  paint();beep(880,.12);
  G.timer=setTimeout(()=>endRound(-1),G.type==='go'?2500:[7000,5500,4000][G.diff]);
}
function gen(T,d){
  if(T==='math'){
    const op=pick(d?['+','-','×']:['+','-']),mx=[10,20,50][d];let a,b,r;
    if(op==='×'){a=2+rnd(d>1?11:8);b=2+rnd(d>1?11:8);r=a*b}
    else{a=2+rnd(mx);b=2+rnd(mx);if(op==='-'&&b>a)[a,b]=[b,a];r=op==='+'?a+b:a-b}
    const s=new Set([r]);while(s.size<d+2){const w=r+(rnd(2)?1:-1)*(1+rnd(op==='×'?9:4));if(w>=0)s.add(w)}
    G.ans=String(r);return{t:'Wie lautet das Ergebnis?',b:`${a}${op}${b}`,o:shuf([...s].map(String))};
  }
  if(T==='color'){
    const wi=rnd(5);let ii;do{ii=rnd(5)}while(ii===wi);
    const s=new Set([ii,wi]);while(s.size<d+2)s.add(rnd(5));
    G.ans=COL[ii][0];return{t:'Welche FARBE hat das Wort?',b:COL[wi][0],c:COL[ii][1],o:shuf([...s].map(i=>COL[i][0]))};
  }
  const n=3+d,h=rnd(360),dl=[24,15,9][d],odd=rnd(n*n),l2=55+(rnd(2)?dl:-dl);let g='';
  for(let i=0;i<n*n;i++)g+=`<button class="tile" data-v="${i}" style="background:hsl(${h} 70% ${i===odd?l2:55}%)"></button>`;
  G.ans=String(odd);return{t:'Tippe das andere Feld!',g,n};
}
function hit(p,v){
  if(!G||G.lk[p])return;
  if(G.phase==='wait'&&G.type==='go')return lock(p,'Fehlstart!');
  if(G.phase!=='live')return;
  const ms=performance.now()-G.t0;
  if(G.type==='go')return endRound(p,ms);
  if(v==null)return;
  v===G.ans?endRound(p,ms):lock(p,'Falsch!');
}
function lock(p,msg){
  G.lk[p]=1;G.st[p]={t:msg,tc:'var(--bad)',b:'✕',c:'var(--bad)'};beep(200,.2);
  if(G.lk.filter(Boolean).length===G.np)endRound(-1);else paint();
}
function endRound(w,ms){
  clearTimeout(G.timer);G.phase='result';scene('idle');G.win=w;
  if(w>=0){
    G.score[w]++;G.times[w].push(ms);G.st[w]={t:'PUNKT!',tc:'var(--ok)',b:fmt(ms),c:'var(--ok)'};
    const k=G.type+G.diff;if(!best[k]||ms<best[k]){if(best[k])G.rec=true;best[k]=ms;ST.set('bd_best',best)}
    beep(700,.2);
  }
  for(let p=0;p<G.np;p++)if(p!==w&&!G.lk[p])G.st[p]={t:w<0?'Zeit abgelaufen':'Zu langsam',tc:'var(--bad)',b:'⏱️'};
  paint();G.timer=setTimeout(nextRound,1500);
}
function finish(){
  G.phase='end';scene('idle');game.innerHTML='';chip.hidden=true;
  const rows=[...Array(G.np).keys()].map(p=>{const t=G.times[p];return{p,s:G.score[p],avg:t.length?t.reduce((a,b)=>a+b,0)/t.length:0,min:t.length?Math.min(...t):0}}).sort((a,b)=>b.s-a.s||(a.avg||9e9)-(b.avg||9e9));
  const med=['🥇','🥈','🥉','4.'];let head;
  if(G.np===1){const q=rows[0].s/G.rounds;head=`<h1>${q===1?'Perfekt!':q>=.7?'Stark!':q>=.4?'Solide!':'Weiter üben!'}</h1><p class="sub">${rows[0].s} von ${G.rounds} Treffern${G.rec?'<br>🏅 Neue Bestzeit!':''}</p>`}
  else{const tie=rows.filter(r=>r.s===rows[0].s).length;head=`<h1 style="font-size:44px">${tie>1?'Unentschieden!':'🏆 Spieler '+(rows[0].p+1)}</h1><p class="sub">${tie>1?tie+' Spieler gleichauf':'gewinnt das Duell'}${G.rec?'<br>🏅 Neue Bestzeit!':''}</p>`}
  ov.innerHTML=`<div class="wrap">${head}${rows.map(r=>`<div class="rk" style="--pc:var(--c${r.p})"><span class="md">${med[rows.findIndex(x=>x.s===r.s)]}</span><i></i><b>${G.np>1?'Spieler '+(r.p+1):'Du'}</b><span class="pt">${r.s} Pkt</span><small>Ø ${r.avg?fmt(r.avg):'–'} · schnellste ${r.min?fmt(r.min):'–'}</small></div>`).join('')}
  <button class="go" id="ag">Nochmal ⚡</button><button class="go alt" id="mn">Menü</button></div>`;
  show();beep(990,.3);$('#ag').onclick=()=>start(G.m);$('#mn').onclick=home;
}
function pause(){
  if(!G||G.phase==='end'||G.phase==='pause')return;
  clearTimeout(G.timer);G.pr=G.phase;G.phase='pause';scene('idle');
  ov.innerHTML=`<div class="wrap"><h1 style="font-size:44px">Pause</h1><p class="sub">Runde ${Math.max(1,G.round)} von ${G.rounds}</p><button class="go" id="rs">Weiter</button><button class="go alt" id="qt">Beenden</button></div>`;
  show();
  $('#rs').onclick=()=>{ov.classList.add('hide');if(['wait','ready','live'].includes(G.pr))G.round--;G.round<0?count(3):nextRound()};
  $('#qt').onclick=home;
}
game.addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(!c)return;e.preventDefault();const b=e.target.closest('[data-v]');hit(+c.dataset.p,b?b.dataset.v:null)});
$('#pz').onclick=pause;
home();
</script>
</body>
</html>
